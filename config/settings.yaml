decoding:
  temperature: 0.0          # fallback to 0.1 if a provider rejects 0.0
  temperature_fallback: 0.1
  seed: 42                  # pass only if provider accepts; swallow errors otherwise
  max_tokens_target: 4096   # thinking models need room for CoT + answer
  max_tokens_judge: 8       # single-token verdict
  top_p: 1.0

retry:
  attempts: 6
  wait_min_s: 2
  wait_max_s: 30
  backoff_multiplier: 2
  retry_on_status: [429, 500, 502, 503, 504]
  retry_on_timeout: true    # IMPORTANT for the slow local judge

concurrency_target: 1       # sequential within a target model by default; >1 for async cloud targets
concurrency_judge: 1        # LOCAL judge: serialize (a single local model ~1 request at a time)

rate:
  nim_rpm: 5                # conservative limit for rate-limited NIM models
  fireworks_rpm: 60         # adjust to your tier
  lmstudio_rpm: 0           # 0 = no artificial gate (the judge semaphore is the real limiter)

budget:                     # APPROXIMATE token kill-switch per CLOUD provider, per run (judge excluded)
  nim_max_tokens: 900000
  fireworks_max_tokens: 2000000
  hard_stop_at_fraction: 0.95

lmstudio:                   # local-judge specifics
  timeout_s: 300            # generous: CPU/quant inference + cold start can be slow
  warmup: true              # send 1 trivial chat call at startup to absorb model load latency
  auto_resolve_model: true  # if configured judge model_id errors, use first id from GET /v1/models
  require_loaded_model: true # fail fast (clear message) if GET /v1/models returns an empty list

micro_test:
  n: 5
  sample_ids: ["benchmark_001","benchmark_030","benchmark_056","benchmark_073","benchmark_086"]
  # = 1 true-single(SimpleQA), 1 true-single(PopQA), 1 true-multi(Bamboogle),
  #   1 false-single(FalseQA label1), 1 false-multi(MultiHoax) -> exercises every branch

judge:
  unparseable_retry: 1
